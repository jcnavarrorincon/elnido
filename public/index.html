<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Nido</title>
  <!-- v2026-04-23 — semáforos + test rápido/completo -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .container { max-width: 960px; margin: 0 auto; padding: 32px 20px; }
    h1 { font-size: 1.6rem; margin-bottom: 8px; color: #fff; }
    h1 span { color: #526d52; }
    .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 32px; }

    /* Tabs */
    .tabs { display: flex; gap: 0; margin-bottom: 24px; border-bottom: 2px solid #222; }
    .tab { padding: 10px 20px; cursor: pointer; font-size: 0.9rem; color: #888; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
    .tab:hover { color: #ccc; }
    .tab.active { color: #6a9f60; border-bottom-color: #6a9f60; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Provider section */
    .provider-section { margin-bottom: 24px; }
    .provider-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .provider-name { font-weight: 700; font-size: 1rem; color: #d4a843; }
    .provider-badge { font-size: 0.7rem; background: #2a2d37; border: 1px solid #3a3d47; border-radius: 10px; padding: 2px 8px; color: #888; margin-left: 8px; }
    .provider-count { font-size: 0.75rem; color: #666; }

    /* Model grid */
    .model-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }

    /* Model card */
    .model-card {
      background: #1a1d27; border-radius: 10px; padding: 14px 16px;
      display: flex; align-items: center; gap: 12px;
      border-left: 4px solid #333; transition: border-color 0.3s;
      position: relative;
    }
    .model-card.fluid { border-left-color: #6a9f60; }
    .model-card.slow { border-left-color: #d4a843; }
    .model-card.down { border-left-color: #c94444; }
    .model-card.testing { border-left-color: #526d52; opacity: 0.7; }

    /* Traffic light */
    .traffic-light {
      width: 42px; height: 42px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; font-weight: 800;
      flex-shrink: 0; transition: all 0.3s;
    }
    .traffic-light.idle { background: #1a1d27; border: 2px solid #333; color: #444; }
    .traffic-light.fluid { background: #1a3320; border: 2px solid #6a9f60; color: #6a9f60; box-shadow: 0 0 12px rgba(106,159,96,0.25); }
    .traffic-light.slow { background: #332a1a; border: 2px solid #d4a843; color: #d4a843; box-shadow: 0 0 12px rgba(212,168,67,0.25); }
    .traffic-light.down { background: #331a1a; border: 2px solid #c94444; color: #c94444; box-shadow: 0 0 12px rgba(201,68,68,0.25); }

    .model-info { flex: 1; min-width: 0; }
    .model-name { font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .model-detail { font-size: 0.72rem; color: #666; margin-top: 2px; display: flex; gap: 8px; align-items: center; }
    .model-detail .tps { color: #6a9f60; font-weight: 600; }
    .model-detail .time { font-family: monospace; }
    .quality-label {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
      padding: 1px 6px; border-radius: 3px; display: inline-block;
    }
    .quality-label.fluid { background: #1a3320; color: #6a9f60; }
    .quality-label.slow { background: #332a1a; color: #d4a843; }
    .quality-label.down { background: #331a1a; color: #c94444; }
    .quality-label.idle { background: #1a1d27; color: #555; }

    .model-actions { display: flex; flex-direction: column; gap: 4px; }
    .btn-sm {
      padding: 4px 10px; border-radius: 5px; border: 1px solid #3a3d47;
      background: #22252f; color: #aaa; cursor: pointer; font-size: 0.7rem;
      transition: all 0.15s; white-space: nowrap;
    }
    .btn-sm:hover { background: #2a2d37; border-color: #526d52; color: #6a9f60; }
    .btn-sm:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Global actions */
    .actions { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .btn-test {
      padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer;
      font-size: 0.9rem; font-weight: 700; transition: all 0.2s;
    }
    .btn-quick { background: #526d52; color: #fff; }
    .btn-quick:hover { background: #6a9f60; }
    .btn-quick:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-full { background: #3a5a3a; color: #c0d8c0; border: 1px solid #526d52; }
    .btn-full:hover { background: #4a6a4a; }
    .btn-full:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-clear { background: #2a2d37; color: #aaa; border: 1px solid #333; }
    .btn-clear:hover { background: #333; }

    /* Summary */
    .summary {
      background: #1a1d27; border-radius: 10px; padding: 16px 20px;
      margin-bottom: 20px; display: flex; gap: 24px; flex-wrap: wrap;
    }
    .summary-item { text-align: center; }
    .summary-item .val { font-size: 1.4rem; font-weight: 800; }
    .summary-item .label { font-size: 0.75rem; color: #888; }

    /* Spinner */
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #333; border-top-color: #6a9f60; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* File explorer */
    .config-section { background: #1a1d27; border-radius: 10px; padding: 20px; margin-bottom: 24px; }
    .config-section h2 { font-size: 1rem; color: #aaa; margin-bottom: 16px; }
    .file-breadcrumb { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; font-size: 0.85rem; }
    .file-breadcrumb span { color: #888; }
    .file-breadcrumb a { color: #6a9f60; cursor: pointer; text-decoration: none; }
    .file-breadcrumb a:hover { text-decoration: underline; }
    .file-list { background: #1a1d27; border-radius: 10px; overflow: hidden; }
    .file-row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; padding: 10px 16px; align-items: center; border-bottom: 1px solid #22252f; cursor: pointer; transition: background 0.15s; }
    .file-row:hover { background: #22252f; }
    .file-row:last-child { border-bottom: none; }
    .file-icon { font-size: 1.1rem; }
    .file-icon.dir { color: #d4a843; }
    .file-icon.file { color: #888; }
    .file-name { font-size: 0.88rem; }
    .file-name.dir { font-weight: 600; color: #e0e0e0; }
    .file-name.file { color: #aaa; }
    .file-size { font-size: 0.75rem; color: #666; font-family: monospace; }
    .file-viewer { background: #1a1d27; border-radius: 10px; padding: 16px; margin-top: 16px; }
    .file-viewer pre { white-space: pre-wrap; word-break: break-all; font-size: 0.8rem; color: #ccc; max-height: 60vh; overflow-y: auto; }
    .file-viewer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .file-viewer-header span { color: #888; font-size: 0.8rem; }
    .btn-back { background: #2a2d37; border: 1px solid #333; color: #aaa; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    .btn-back:hover { background: #333; }

    /* System info */
    .sys-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
    .sys-card { background: #1a1d27; border-radius: 10px; padding: 20px; text-align: center; }
    .sys-card .val { font-size: 1.8rem; font-weight: 800; margin-bottom: 4px; }
    .sys-card .label { font-size: 0.8rem; color: #888; }
    .sys-bar { height: 6px; background: #22252f; border-radius: 3px; margin-top: 10px; overflow: hidden; }
    .sys-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }

    /* History */
    .history-section { margin-top: 24px; }
    .history-row { display: flex; gap: 8px; font-size: 0.75rem; color: #666; padding: 4px 0; border-bottom: 1px solid #1a1d27; }
    .history-row .h-time { font-family: monospace; width: 70px; }
    .history-row .h-model { flex: 1; }
    .history-row .h-result { width: 60px; text-align: right; font-family: monospace; }

    /* Responsive */
    @media (max-width: 600px) {
      .model-grid { grid-template-columns: 1fr; }
      .actions { flex-direction: column; }
      .summary { gap: 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><span style="color:#d4a843">El</span> <span>Nido</span></h1>
    <p class="subtitle">Modelos · Archivos · Sistema</p>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" onclick="switchTab('models')">🔍 Modelos</div>
      <div class="tab" onclick="switchTab('files')">📁 Archivos</div>
      <div class="tab" onclick="switchTab('system')">💻 Sistema</div>
    </div>

    <!-- Tab: Models -->
    <div class="tab-content active" id="tab-models">

    <!-- Global actions -->
    <div class="actions">
      <button class="btn-test btn-quick" id="btnQuick" onclick="testAll('quick')">⚡ Test rápido</button>
      <button class="btn-test btn-full" id="btnFull" onclick="testAll('full')">🔄 Test completo</button>
      <button class="btn-test btn-clear" onclick="clearResults()">Limpiar</button>
    </div>

    <!-- Summary -->
    <div class="summary" id="summary" style="display:none"></div>

    <!-- Providers & Models -->
    <div id="providersContainer"></div>

    </div>

    <!-- Tab: Files -->
    <div class="tab-content" id="tab-files">
      <div class="config-section">
        <h2>Explorador de archivos</h2>
        <div class="file-breadcrumb" id="breadcrumb"></div>
        <div class="file-list" id="fileList"></div>
        <div class="file-viewer" id="fileViewer" style="display:none">
          <div class="file-viewer-header">
            <span id="viewerPath"></span>
            <button class="btn-back" onclick="closeViewer()">← Volver</button>
          </div>
          <pre id="viewerContent"></pre>
        </div>
      </div>
    </div>

    <!-- Tab: System -->
    <div class="tab-content" id="tab-system">
      <div class="config-section">
        <h2>Estado del sistema</h2>
        <div class="sys-grid" id="sysGrid"></div>
      </div>
    </div>
  </div>

  <script>
    let providers = [];
    let results = {};   // key: "provider/model" → last result
    let history = [];   // all test results over time
    let testing = false;

    // ── Quality helpers ──
    function getQuality(ok, elapsed) {
      if (!ok) return 'down';
      if (elapsed < 2000) return 'fluid';
      if (elapsed < 5000) return 'slow';
      return 'down';
    }
    function getQualityIcon(q) {
      if (q === 'fluid') return '✓';
      if (q === 'slow') return '⚠';
      return '✕';
    }
    function getQualityLabel(q) {
      if (q === 'fluid') return '🟢 Fluido';
      if (q === 'slow') return '🟡 Lento';
      return '🔴 No usable';
    }

    // ── Init: load providers from server ──
    async function init() {
      try {
        const res = await fetch('/api/config');
        const data = await res.json();
        providers = data.providers || [];
      } catch (e) {
        console.error('Error loading config:', e);
        providers = [];
      }
      // Restore results from localStorage
      const saved = localStorage.getItem('mh_results');
      if (saved) {
        try { results = JSON.parse(saved); } catch {}
      }
      const savedH = localStorage.getItem('mh_history');
      if (savedH) {
        try { history = JSON.parse(savedH); } catch {}
      }
      renderProviders();
      if (Object.keys(results).length > 0) showSummary();
    }

    function saveResults() {
      localStorage.setItem('mh_results', JSON.stringify(results));
      localStorage.setItem('mh_history', JSON.stringify(history.slice(-200)));
    }

    // ── Render ──
    function renderProviders() {
      const el = document.getElementById('providersContainer');
      if (!providers.length) {
        el.innerHTML = '<div class="config-section"><h2>No hay proveedores configurados</h2></div>';
        return;
      }
      el.innerHTML = providers.map((p, pi) => {
        const qCounts = countQuality(p);
        return `
          <div class="provider-section">
            <div class="provider-header">
              <div>
                <span class="provider-name">${p.id}</span>
                <span class="provider-badge">${p.type}</span>
                <span class="provider-count">${qCounts.fluid}🟢 ${qCounts.slow}🟡 ${qCounts.down}🔴</span>
              </div>
            </div>
            <div class="model-grid">
              ${p.models.map((m, mi) => {
                const key = p.id + '/' + m.id;
                const r = results[key];
                const q = r ? getQuality(r.ok, r.elapsed) : 'idle';
                const testing_ = testing && r?._testing;
                return `
                  <div class="model-card ${q} ${testing_ ? 'testing' : ''}">
                    <div class="traffic-light ${q}">${q === 'idle' ? '·' : getQualityIcon(q)}</div>
                    <div class="model-info">
                      <div class="model-name" title="${m.id}">${m.name || m.id}</div>
                      <div class="model-detail">
                        ${r ? `
                          <span class="time">${(r.elapsed/1000).toFixed(1)}s</span>
                          <span class="quality-label ${q}">${getQualityLabel(q)}</span>
                          ${r.tps ? `<span class="tps">${r.tps} t/s</span>` : ''}
                          ${r.mode === 'full' ? '<span>🔄</span>' : '<span>⚡</span>'}
                        ` : '<span style="color:#555">Sin test</span>'}
                      </div>
                    </div>
                    <div class="model-actions">
                      <button class="btn-sm" onclick="testOne(${pi},${mi},'quick')" ${testing ? 'disabled' : ''}>⚡</button>
                      <button class="btn-sm" onclick="testOne(${pi},${mi},'full')" ${testing ? 'disabled' : ''}>🔄</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function countQuality(p) {
      let fluid = 0, slow = 0, down = 0;
      p.models.forEach(m => {
        const r = results[p.id + '/' + m.id];
        const q = r ? getQuality(r.ok, r.elapsed) : null;
        if (q === 'fluid') fluid++;
        else if (q === 'slow') slow++;
        else if (q === 'down') down++;
      });
      return { fluid, slow, down };
    }

    function showSummary() {
      const all = Object.values(results);
      const fluid = all.filter(r => getQuality(r.ok, r.elapsed) === 'fluid').length;
      const slow = all.filter(r => getQuality(r.ok, r.elapsed) === 'slow').length;
      const down = all.filter(r => getQuality(r.ok, r.elapsed) === 'down').length;
      const ok = all.filter(r => r.ok);
      const avg = ok.length ? ok.reduce((s, r) => s + r.elapsed, 0) / ok.length : 0;
      const fastest = ok.length ? ok.reduce((a, b) => a.elapsed < b.elapsed ? a : b) : null;

      const el = document.getElementById('summary');
      el.style.display = 'flex';
      el.innerHTML = `
        <div class="summary-item"><div class="val" style="color:#6a9f60">🟢 ${fluid}</div><div class="label">Fluido</div></div>
        <div class="summary-item"><div class="val" style="color:#d4a843">🟡 ${slow}</div><div class="label">Lento</div></div>
        <div class="summary-item"><div class="val" style="color:#c94444">🔴 ${down}</div><div class="label">No usable</div></div>
        <div class="summary-item"><div class="val" style="color:#d4a843">${avg ? (avg/1000).toFixed(1)+'s' : '—'}</div><div class="label">Media</div></div>
        <div class="summary-item"><div class="val" style="color:#6a9f60">${fastest ? (fastest.elapsed/1000).toFixed(1)+'s' : '—'}</div><div class="label">Más rápido</div></div>
        ${fastest ? `<div class="summary-item"><div class="val" style="color:#6a9f60;font-size:0.9rem">${fastest.name || fastest.model}</div><div class="label">Modelo</div></div>` : ''}
      `;
    }

    // ── Test single model ──
    async function testOne(pi, mi, mode) {
      const p = providers[pi];
      const m = p.models[mi];
      const key = p.id + '/' + m.id;
      testing = true;
      results[key] = { ok: true, elapsed: 0, _testing: true };
      renderProviders();

      const start = Date.now();
      try {
        const res = await fetch('/api/test', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            provider: p.type, baseUrl: p.baseUrl,
            apiKey: p.apiKey, headerKey: p.headerKey,
            model: m.id, mode
          })
        });
        const r = await res.json();
        r.name = m.name || m.id;
        r.providerId = p.id;
        results[key] = r;
        history.push({ ...r, providerKey: p.id });
      } catch (e) {
        results[key] = { ok: false, model: m.id, name: m.name, provider: p.id, elapsed: Date.now() - start, error: e.message, timestamp: new Date().toISOString(), mode };
        history.push(results[key]);
      }
      testing = false;
      saveResults();
      renderProviders();
      showSummary();
    }

    // ── Test all ──
    async function testAll(mode) {
      testing = true;
      const btnQ = document.getElementById('btnQuick');
      const btnF = document.getElementById('btnFull');
      btnQ.disabled = true; btnQ.innerHTML = '<span class="spinner"></span> Testeando...';
      btnF.disabled = true;

      for (const p of providers) {
        for (const m of p.models) {
          const key = p.id + '/' + m.id;
          results[key] = { ok: true, elapsed: 0, _testing: true };
          renderProviders();

          const start = Date.now();
          try {
            const res = await fetch('/api/test', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                provider: p.type, baseUrl: p.baseUrl,
                apiKey: p.apiKey, headerKey: p.headerKey,
                model: m.id, mode
              })
            });
            const r = await res.json();
            r.name = m.name || m.id;
            r.providerId = p.id;
            results[key] = r;
            history.push({ ...r, providerKey: p.id });
          } catch (e) {
            results[key] = { ok: false, model: m.id, name: m.name, provider: p.id, elapsed: Date.now() - start, error: e.message, timestamp: new Date().toISOString(), mode };
            history.push(results[key]);
          }
          renderProviders();
        }
      }

      testing = false;
      btnQ.disabled = false; btnQ.innerHTML = '⚡ Test rápido';
      btnF.disabled = false;
      saveResults();
      showSummary();
    }

    function clearResults() {
      results = {};
      history = [];
      localStorage.removeItem('mh_results');
      localStorage.removeItem('mh_history');
      renderProviders();
      document.getElementById('summary').style.display = 'none';
    }

    // ── Tabs ──
    function switchTab(name) {
      var tabs = document.querySelectorAll('.tab');
      var names = ['models','files','system'];
      for (var i = 0; i < tabs.length; i++) tabs[i].classList.toggle('active', names[i] === name);
      var contents = document.querySelectorAll('.tab-content');
      for (var j = 0; j < contents.length; j++) contents[j].classList.remove('active');
      document.getElementById('tab-' + name).classList.add('active');
      if (name === 'files') loadDir('/home');
      if (name === 'system') loadSystem();
    }

    // ── File explorer ──
    function loadDir(dir) {
      closeViewer();
      var xhr = new XMLHttpRequest();
      xhr.open('GET', '/api/files?dir=' + encodeURIComponent(dir), true);
      xhr.onload = function() {
        var data = JSON.parse(xhr.responseText);
        if (data.error) { alert(data.error); return; }
        var parts = data.dir.split('/').filter(Boolean);
        var pathSoFar = '';
        var bc = document.getElementById('breadcrumb');
        var bcHtml = '<a onclick="loadDir(\'/\')" style="cursor:pointer;color:#6a9f60">/</a>';
        for (var k = 0; k < parts.length; k++) {
          pathSoFar += '/' + parts[k];
          bcHtml += '<span style="color:#888">/</span><a onclick="loadDir(\'' + pathSoFar + '\')" style="cursor:pointer;color:#6a9f60">' + parts[k] + '</a>';
        }
        bc.innerHTML = bcHtml;
        var fl = document.getElementById('fileList');
        if (!data.items.length) { fl.innerHTML = '<div style="padding:20px;color:#666;text-align:center">Vacío</div>'; return; }
        var html = '';
        if (data.dir !== '/') html += '<div class="file-row" onclick="loadDir(\'' + data.parent + '\')"><span class="file-icon dir">📁</span><span class="file-name dir">..</span><span class="file-size"></span></div>';
        for (var m = 0; m < data.items.length; m++) {
          var it = data.items[m];
          var action = it.type === 'dir' ? 'loadDir(\'' + it.path + '\')' : 'viewFile(\'' + it.path + '\')';
          var icon = it.type === 'dir' ? '📁' : '📄';
          html += '<div class="file-row" onclick="' + action + '"><span class="file-icon ' + it.type + '">' + icon + '</span><span class="file-name ' + it.type + '">' + it.name + '</span><span class="file-size"></span></div>';
        }
        fl.innerHTML = html;
      };
      xhr.send();
    }
    function viewFile(path) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', '/api/file?path=' + encodeURIComponent(path), true);
      xhr.onload = function() {
        var data = JSON.parse(xhr.responseText);
        if (data.error) { alert(data.error); return; }
        document.getElementById('fileViewer').style.display = 'block';
        document.getElementById('viewerPath').textContent = data.path + ' (' + (data.size/1024).toFixed(1) + ' KB)';
        document.getElementById('viewerContent').textContent = data.content;
        document.getElementById('fileList').style.display = 'none';
        document.getElementById('breadcrumb').style.display = 'none';
      };
      xhr.send();
    }
    function closeViewer() {
      document.getElementById('fileViewer').style.display = 'none';
      document.getElementById('fileList').style.display = '';
      document.getElementById('breadcrumb').style.display = '';
    }

    // ── System info ──
    function loadSystem() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', '/api/disk', true);
      xhr.onload = function() {
        var data = JSON.parse(xhr.responseText);
        var grid = document.getElementById('sysGrid');
        var cards = '';
        if (data.disk) {
          var pct = parseInt(data.disk.percent);
          var bg = pct > 80 ? '#c94444' : pct > 60 ? '#d4a843' : '#6a9f60';
          cards += '<div class="sys-card"><div class="val" style="color:#6a9f60">' + data.disk.percent + '</div><div class="label">Disco</div><div class="sys-bar"><div class="sys-bar-fill" style="width:' + pct + '%;background:' + bg + '"></div></div><div style="margin-top:8px;font-size:0.75rem;color:#888">' + data.disk.used + ' / ' + data.disk.total + '</div></div>';
        }
        if (data.ram) {
          var pct2 = parseInt(data.ram.percent);
          var bg2 = pct2 > 80 ? '#c94444' : pct2 > 60 ? '#d4a843' : '#6a9f60';
          cards += '<div class="sys-card"><div class="val" style="color:#d4a843">' + data.ram.percent + '</div><div class="label">RAM</div><div class="sys-bar"><div class="sys-bar-fill" style="width:' + pct2 + '%;background:' + bg2 + '"></div></div><div style="margin-top:8px;font-size:0.75rem;color:#888">' + data.ram.used + ' / ' + data.ram.total + '</div></div>';
        }
        cards += '<div class="sys-card"><div class="val" style="color:#6a9f60">' + (data.uptime || '--') + '</div><div class="label">Uptime</div></div>';
        grid.innerHTML = cards;
      };
      xhr.send();
    }

    init();
  </script>
</body>
</html>
